<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Math Mountains - 1st Grade</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #f1f5f9;
    color: #0f172a;
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 1vh 1vw;
  }
  .app {
    background: #ffffff;
    width: 100%;
    max-width: 820px;
    border-radius: 10px;
    border: 3px solid #334155;
    padding: 10px 16px;
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid #e2e8f0;
    padding-bottom: 6px;
  }
  h1 { font-size: 1.4rem; color: #1e3a8a; }
  .score { font-size: 1.1rem; font-weight: bold; color: #047857; background: #d1fae5; padding: 4px 10px; border-radius: 6px; }
  .mountain-wrap {
    position: relative;
    height: 230px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 6px 0;
  }
  .peak-box {
    width: 80px;
    height: 64px;
    background: #fef08a;
    border: 4px solid #ca8a04;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.2rem;
    font-weight: 800;
    z-index: 2;
  }
  .slopes {
    position: absolute;
    top: 55px;
    width: 320px;
    height: 120px;
    border-left: 6px solid #475569;
    border-right: 6px solid #475569;
    transform: perspective(180px) rotateX(25deg);
    z-index: 1;
  }
  .dots-row {
    display: flex;
    justify-content: space-between;
    width: 380px;
    z-index: 2;
    margin-top: 8px;
  }
  .dot-col {
    display: flex;
    flex-wrap: wrap;
    width: 110px;
    gap: 5px;
    justify-content: center;
    align-content: center;
    min-height: 48px;
  }
  .dot {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #2563eb;
  }
  .dot.right-dot { background: #16a34a; }
  .base-row {
    display: flex;
    justify-content: space-between;
    width: 420px;
    z-index: 2;
  }
  .partner-box {
    width: 90px;
    height: 68px;
    background: #e0f2fe;
    border: 4px solid #0284c7;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.2rem;
    font-weight: 800;
  }
  input.partner-input {
    width: 90px;
    height: 68px;
    font-size: 2.2rem;
    font-weight: 800;
    text-align: center;
    border: 4px solid #2563eb;
    border-radius: 12px;
    background: #eff6ff;
    color: #0f172a;
    -moz-appearance: textfield;
  }
  input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input:focus { outline: none; border-color: #f59e0b; background: #fffbeb; }
  .feedback {
    min-height: 28px;
    font-size: 1.25rem;
    font-weight: bold;
  }
  .ok { color: #15803d; }
  .err { color: #b91c1c; }
  .hint { font-size: 0.95rem; color: #475569; }
</style>
</head>
<body>
<div class="app">
  <div class="top-bar">
    <h1>⛰️ Math Mountains (Partners to 10)</h1>
    <div class="score">Streak: <span id="streak">0</span></div>
  </div>
  <p class="hint">Count on from the known partner to the top number. Type the missing partner and press <strong>Enter</strong>.</p>
  <div class="mountain-wrap">
    <div class="peak-box" id="total-box">10</div>
    <div class="slopes"></div>
    <div class="dots-row">
      <div class="dot-col" id="left-dots"></div>
      <div class="dot-col" id="right-dots"></div>
    </div>
    <div class="base-row">
      <div class="partner-box" id="known-box">6</div>
      <input type="number" id="ans-input" class="partner-input" placeholder="?" autocomplete="off">
    </div>
  </div>
  <div class="feedback" id="feedback">Press Enter to check your answer!</div>
</div>

<script>
  let total = 10, known = 6, missing = 4, streak = 0, waitingNext = false;
  const totalEl = document.getElementById('total-box');
  const knownEl = document.getElementById('known-box');
  const leftDots = document.getElementById('left-dots');
  const rightDots = document.getElementById('right-dots');
  const inputEl = document.getElementById('ans-input');
  const fbEl = document.getElementById('feedback');
  const streakEl = document.getElementById('streak');

  function renderDots(container, count, cls) {
    container.innerHTML = '';
    for (let i = 0; i < count; i++) {
      const d = document.createElement('div');
      d.className = 'dot ' + (cls || '');
      container.appendChild(d);
    }
  }

  function newProblem() {
    const totals = [6, 7, 8, 9, 10, 10, 10];
    total = totals[Math.floor(Math.random() * totals.length)];
    known = Math.floor(Math.random() * (total - 1)) + 1;
    missing = total - known;
    totalEl.textContent = total;
    knownEl.textContent = known;
    renderDots(leftDots, known, '');
    rightDots.innerHTML = '';
    inputEl.value = '';
    inputEl.disabled = false;
    fbEl.textContent = 'Type the missing partner and press Enter.';
    fbEl.className = 'feedback';
    waitingNext = false;
    inputEl.focus();
  }

  function check() {
    const val = parseInt(inputEl.value, 10);
    if (isNaN(val)) return;
    if (val === missing) {
      streak++;
      streakEl.textContent = streak;
      renderDots(rightDots, missing, 'right-dot');
      fbEl.textContent = `Correct! ${known} + ${missing} = ${total}. [Press Enter for Next]`;
      fbEl.className = 'feedback ok';
      inputEl.disabled = true;
      waitingNext = true;
    } else {
      streak = 0;
      streakEl.textContent = streak;
      fbEl.textContent = `Not quite! Start at ${known} and count up to ${total}. Try again!`;
      fbEl.className = 'feedback err';
      inputEl.value = '';
      inputEl.focus();
    }
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      if (waitingNext) newProblem();
      else check();
    }
  });

  window.onload = newProblem;
</script>
</body>
</html>
