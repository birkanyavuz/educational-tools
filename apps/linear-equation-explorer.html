<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linear Equation Explorer</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f4f7f6;
            color: #333;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 600px;
            width: 100%;
        }
        h1 {
            color: #2c3e50;
            margin-top: 0;
        }
        .equation-display {
            font-size: 28px;
            font-weight: bold;
            color: #2980b9;
            background: #ecf0f1;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            font-family: 'Courier New', Courier, monospace;
        }
        .controls {
            display: flex;
            justify-content: space-around;
            margin-bottom: 25px;
            background: #fff;
            padding: 15px;
            border: 2px solid #ecf0f1;
            border-radius: 8px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        label {
            font-weight: bold;
            margin-bottom: 10px;
            color: #34495e;
        }
        input[type="range"] {
            width: 150px;
            cursor: pointer;
        }
        .value-display {
            font-size: 18px;
            font-weight: bold;
            margin-top: 5px;
            color: #e74c3c;
        }
        canvas {
            background-color: white;
            border: 2px solid #bdc3c7;
            border-radius: 4px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Linear Equation Explorer</h1>
    
    <div class="controls">
        <div class="control-group">
            <label for="slope">Slope (m)</label>
            <input type="range" id="slope" min="-5" max="5" step="0.5" value="1">
            <div class="value-display" id="slope-val">1</div>
        </div>
        <div class="control-group">
            <label for="intercept">Y-Intercept (b)</label>
            <input type="range" id="intercept" min="-10" max="10" step="1" value="0">
            <div class="value-display" id="intercept-val">0</div>
        </div>
    </div>

    <div class="equation-display">
        y = <span id="eq-m">1</span>x <span id="eq-b">+ 0</span>
    </div>

    <canvas id="graph" width="400" height="400"></canvas>
</div>

<script>
    const canvas = document.getElementById('graph');
    const ctx = canvas.getContext('2d');
    
    const slopeSlider = document.getElementById('slope');
    const interceptSlider = document.getElementById('intercept');
    
    const slopeValDisplay = document.getElementById('slope-val');
    const interceptValDisplay = document.getElementById('intercept-val');
    const eqM = document.getElementById('eq-m');
    const eqB = document.getElementById('eq-b');

    // Graph settings
    const width = canvas.width;
    const height = canvas.height;
    const originX = width / 2;
    const originY = height / 2;
    const scale = 20; // 20 pixels per math unit

    function drawGrid() {
        ctx.clearRect(0, 0, width, height);
        
        // Draw grid lines
        ctx.strokeStyle = '#ecf0f1';
        ctx.lineWidth = 1;
        for (let i = 0; i <= width; i += scale) {
            ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, height); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(width, i); ctx.stroke();
        }

        // Draw axes
        ctx.strokeStyle = '#2c3e50';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(originX, 0); ctx.lineTo(originX, height); ctx.stroke(); // Y axis
        ctx.beginPath(); ctx.moveTo(0, originY); ctx.lineTo(width, originY); ctx.stroke(); // X axis
    }

    function drawLine(m, b) {
        ctx.strokeStyle = '#e74c3c';
        ctx.lineWidth = 3;
        ctx.beginPath();
        
        // Calculate two points off-screen to draw the line across the canvas
        // Math coordinates to Canvas coordinates: 
        // canvasX = originX + (mathX * scale)
        // canvasY = originY - (mathY * scale) // Y is inverted on canvas
        
        const mathX1 = -15;
        const mathY1 = (m * mathX1) + b;
        const cx1 = originX + (mathX1 * scale);
        const cy1 = originY - (mathY1 * scale);

        const mathX2 = 15;
        const mathY2 = (m * mathX2) + b;
        const cx2 = originX + (mathX2 * scale);
        const cy2 = originY - (mathY2 * scale);

        ctx.moveTo(cx1, cy1);
        ctx.lineTo(cx2, cy2);
        ctx.stroke();
    }

    function update() {
        const m = parseFloat(slopeSlider.value);
        const b = parseFloat(interceptSlider.value);

        // Update UI text
        slopeValDisplay.innerText = m;
        interceptValDisplay.innerText = b;
        
        // Format equation nicely (e.g., hiding 1x, handling negative intercepts)
        let mText = m === 1 ? "" : (m === -1 ? "-" : m);
        let bText = b === 0 ? "" : (b > 0 ? `+ ${b}` : `- ${Math.abs(b)}`);
        
        // Edge case for slope = 0
        if (m === 0) {
            eqM.innerText = "0";
            bText = b === 0 ? "" : (b > 0 ? `${b}` : `- ${Math.abs(b)}`);
            eqB.innerText = bText === "" ? "" : (b > 0 && m !== 0 ? ` + ${b}` : ` ${bText}`);
        } else {
            eqM.innerText = mText;
            eqB.innerText = bText === "" ? "" : ` ${bText}`;
        }

        drawGrid();
        drawLine(m, b);
    }

    // Event Listeners
    slopeSlider.addEventListener('input', update);
    interceptSlider.addEventListener('input', update);

    // Initial draw
    update();
</script>

</body>
</html>
