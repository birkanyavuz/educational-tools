    const inputField = document.getElementById('student-answer');
    const feedbackDiv = document.getElementById('feedback');
    const casesDisplay = document.getElementById('cases-solved');
    const totalCasesDisplay = document.getElementById('total-cases');

    // Dynamically set the total cases display based on array length
    totalCasesDisplay.innerText = sentences.length;

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    function loadSentence() {
        if (currentIndex >= sentences.length) {
            sentenceDiv.innerText = "All sentences fixed! The Gremlin is trapped!";
            inputField.style.display = 'none';
            feedbackDiv.style.display = 'none';
            return;
        }

        sentenceDiv.innerText = sentences[currentIndex].broken;
        inputField.value = '';
        feedbackDiv.innerText = '';
        feedbackDiv.className = '';
        inputField.focus();
    }

    // Helper function to sanitize input (removes accidental double spaces)
    function cleanString(str) {
        return str.replace(/\s+/g, ' ').trim();
    }

    function checkAnswer() {
        const studentGuess = cleanString(inputField.value);
        const correctSentence = sentences[currentIndex].fixed;
        
        if (studentGuess === "") {
            feedbackDiv.innerText = "You have to type something!";
            feedbackDiv.className = "incorrect";
            return;
        }

        if (studentGuess === correctSentence) {
            sentencesFixed++;
            casesDisplay.innerText = sentencesFixed;

            feedbackDiv.innerText = "✓ Perfect! Gremlin trapped!";
            feedbackDiv.className = "correct";
            inputField.disabled = true; 
            
            setTimeout(() => {
                currentIndex++;
                inputField.disabled = false;
                loadSentence();
            }, 1500); 
        } else {
            // Targeted Hint Logic
            let hint = "✗ Not quite. ";
            
            // Check starting capital
            if (studentGuess.charAt(0) !== correctSentence.charAt(0)) {
                hint += "Check your starting capital letter! ";
            }
            
            // Check end punctuation (looking for . ? or !)
            const lastChar = studentGuess.charAt(studentGuess.length - 1);
            if (lastChar !== '.' && lastChar !== '?' && lastChar !== '!') {
                hint += "Did you forget your ending punctuation? ";
            } else if (lastChar !== correctSentence.charAt(correctSentence.length - 1)) {
                hint += "You used the wrong ending punctuation mark. ";
            }

            // Check if they missed a proper noun in the middle (if start and end are fine)
            if (hint === "✗ Not quite. ") {
                hint += "Look closely for missing capital letters on names or places, or check your spelling.";
            }

            feedbackDiv.innerText = hint;
            feedbackDiv.className = "incorrect";
            inputField.focus();
        }
    }

    // ENTER KEY VALIDATION ONLY
    inputField.addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
            event.preventDefault();
            checkAnswer();
        }
    });

    shuffle(sentences);
    loadSentence();
