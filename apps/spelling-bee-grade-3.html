<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>3rd Grade Spelling Bee</title>
    <style>

        }
        .container {

            padding: 20px 30px; 
            border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            max-width: 700px; 
            margin: 0 auto; 
            border-top: 8px solid #f39c12;
            position: relative;
        }
        
        .score-board {
            position: absolute;
            top: 15px; 
            right: 20px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #27ae60;
            background: #e8f8f5;
            padding: 6px 12px;
            border-radius: 20px;
            border: 2px solid #2ecc71;
        }

        p { font-size: 1.1rem; color: #7f8c8d; margin-top: 0; margin-bottom: 15px; }
        
        .controls { margin: 10px 0; display: flex; flex-direction: column; align-items: center; gap: 10px; } 
        
        .slider-container {
            background: #f8f9fa;
            padding: 8px 15px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 0.9rem;
        }

        .action-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        button { 
            padding: 12px 20px; 
            font-size: 16px; 
            font-weight: bold;
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: transform 0.1s, opacity 0.2s, background-color 0.2s;
        }
        button:active:not(:disabled) { transform: scale(0.95); }
        button:hover:not(:disabled) { opacity: 0.9; }
        button:disabled { 
            background-color: #bdc3c7 !important; 
            cursor: not-allowed; 
            transform: none; 
            opacity: 0.6;
        }
        
        .btn-speak { background-color: #3498db; font-size: 18px; padding: 12px 25px; }
        .btn-check { background-color: #27ae60; padding: 12px 25px; font-size: 18px;}
        .btn-next { background-color: #9b59b6; display: none; padding: 12px 25px; font-size: 18px;}
        .btn-skip { background-color: #e74c3c; padding: 12px 25px; font-size: 18px;}
        
        /* Lifeline Buttons */
        .lifeline-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px; 
        }
        .btn-lifeline { background-color: #f39c12; color: white; font-size: 13px; padding: 8px 12px;}
        
        input[type="text"] { 
            padding: 12px; 
            font-size: 22px; 
            width: 80%; 
            border: 3px solid #bdc3c7; 
            border-radius: 8px; 
            text-align: center; 
            margin-bottom: 15px; 
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus { border-color: #3498db; }
        input[type="text"]:disabled { background-color: #f2f2f2; border-color: #ddd; }
        
        #clue-box {
            background: #fff3cd;
            color: #856404;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ffeeba;
            margin-bottom: 15px;
            font-size: 1rem;
            display: none;
            text-align: left;
        }

        #feedback { 
            font-size: 26px; 
            font-weight: bold; 
            margin-top: 5px; 
            min-height: 40px; 
        }
        /* Added background highlights to make the feedback extremely obvious */
        .correct { color: #27ae60; background: #e8f8f5; padding: 5px 20px; border-radius: 8px; display: inline-block; }
        .incorrect { color: #e74c3c; background: #fdfefe; border: 2px solid #fadbd8; padding: 5px 20px; border-radius: 8px; display: inline-block; }
        
        .word-counter {
            font-size: 0.9rem;
            color: #95a5a6;
            margin-top: 15px;
        }
    </style>
</head>

<div class="container">
    <div class="score-board" id="score-display">Score: 0</div>
    
    <h1>🐝 Spelling Bee!</h1>
    <p>Listen to the word, type it below, and press <strong>Enter</strong>.</p>
    
    <div class="controls">

        <div class="slider-container">

            <input type="range" id="speed-slider" min="0.3" max="1" step="0.1" value="0.6">
        </div>
    </div>

    <div class="lifeline-row" id="lifeline-controls">
        <button class="btn-lifeline" onclick="showClue('def')">📖 Definition</button>
        <button class="btn-lifeline" onclick="showClue('pos')">🎭 Part of Speech</button>
        <button class="btn-lifeline" onclick="showClue('sen')">📝 Sentence</button>
    </div>

    <div id="clue-box"></div>

    <input type="text" id="spell-input" placeholder="Type your spelling here..." autocomplete="off">
    
    <div class="action-row">
        <button class="btn-check" id="check-btn" onclick="checkSpelling()">Check Answer</button>
        <button class="btn-skip" id="skip-btn" onclick="skipWord()">⏭️ Skip Word</button>
        <button class="btn-next" id="next-btn" onclick="nextWord()">Next Word ➡️</button>
    </div>

    <div id="feedback"></div>
    <div class="word-counter" id="counter">Word 1 of 10</div>
</div>

    const scoreDisplay = document.getElementById("score-display");

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    function init() {
        shuffleArray(dictionary);
        activeWords = dictionary.slice(0, 10);
        updateScore();
        updateCounter();
        loadWord();
    }

    function loadWord() {
        currentWordObj = activeWords[currentWordIndex];
        setTimeout(speakWord, 500);
    }

    function speakWord() {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const wordToSpeak = currentWordObj[0]; // Index 0 is the word
            const utterance = new SpeechSynthesisUtterance(wordToSpeak);
            utterance.rate = parseFloat(speedSlider.value); 
            window.speechSynthesis.speak(utterance);
            if(!inputField.disabled) inputField.focus();
        } else {
            alert("Sorry, your browser doesn't support text-to-speech!");
        }
    }

    function showClue(type) {
        clueBox.style.display = "block";
        if (type === 'def') {
            clueBox.innerHTML = `<strong>📖 Definition:</strong> ${currentWordObj[2]}`;
        } else if (type === 'pos') {
            clueBox.innerHTML = `<strong>🎭 Part of Speech:</strong> ${currentWordObj[1]}`;
        } else if (type === 'sen') {
            let hiddenSentence = currentWordObj[3].replace(new RegExp(currentWordObj[0], "ig"), "_____");
            clueBox.innerHTML = `<strong>📝 Sentence:</strong> "${hiddenSentence}"`;
        }
        inputField.focus();
    }

    function skipWord() {
        const actualWord = currentWordObj[0];
        feedbackDiv.innerHTML = `<span class='incorrect'>⏭️ Skipped! The word was: <strong>${actualWord}</strong></span>`;
        lockUI();
    }

    function checkSpelling() {
        const guess = inputField.value.trim().toLowerCase();
        const actualWord = currentWordObj[0].toLowerCase();

        if (guess === "") return;

        if (guess === actualWord) {
            feedbackDiv.innerHTML = "<span class='correct'>✅ Correct!</span>";
            score++;
            updateScore();
            lockUI();
        } else {
            feedbackDiv.innerHTML = "<span class='incorrect'>❌ Incorrect! Try again.</span>";
            inputField.value = ""; 
        }
    }

    function lockUI() {
        inputField.disabled = true;
        checkBtn.style.display = "none";
        skipBtn.style.display = "none";
        lifelineRow.style.display = "none";
        clueBox.style.display = "none";
        nextBtn.style.display = "inline-block";
        nextBtn.focus();
    }

    function nextWord() {
        currentWordIndex++;
        
        if (currentWordIndex >= activeWords.length) {
            feedbackDiv.innerHTML = `<span class='correct'>🎉 You finished the spelling bee! Final Score: ${score}/10. Refresh to play again!</span>`;
            inputField.style.display = "none";
            checkBtn.style.display = "none";
            nextBtn.style.display = "none";
            skipBtn.style.display = "none";
            lifelineRow.style.display = "none";
            clueBox.style.display = "none";
            document.querySelector('.btn-speak').style.display = "none";
            speedSlider.parentElement.style.display = "none";
            return;
        }

        // Reset UI for the next word
        inputField.value = "";
        inputField.disabled = false;
        feedbackDiv.innerHTML = "";
        clueBox.style.display = "none";
        
        checkBtn.style.display = "inline-block";
        skipBtn.style.display = "inline-block";
        lifelineRow.style.display = "flex";
        nextBtn.style.display = "none";
        
        updateCounter();
        loadWord();
    }
    
    function updateCounter() {
        counterDiv.innerText = `Word ${currentWordIndex + 1} of ${activeWords.length}`;
    }

    function updateScore() {
        scoreDisplay.innerText = `Score: ${score}`;
    }

    // Keydown explicitly prevents the event from bubbling up to the document
    inputField.addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
            event.preventDefault(); 
            event.stopPropagation(); // BUG FIX: Prevents Enter from instantly clicking "Next Word"
            checkSpelling();
        }
    });

    document.addEventListener("keydown", function(event) {
        if (event.key === "Enter" && nextBtn.style.display === "inline-block") {
            event.preventDefault();
            nextWord();
        }
    });

    window.onload = init;
</script>

</body>
</html>
