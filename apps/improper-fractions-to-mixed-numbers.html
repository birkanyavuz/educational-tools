<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Improper to Mixed Number Trainer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #ffffff;
    color: #1e293b;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 0;
    overflow: hidden;
  }
  #app-container {
    display: flex;
    flex-direction: row;
    gap: clamp(10px, 1.5vw, 24px);
    background: #ffffff;
    border: none;
    border-radius: 0;
    width: 100%;
    max-width: 1500px;
    height: calc(100vh - 204px);
    height: calc(100dvh - 204px);   /* pulled up ~2 inches so the bottom fits on a Chromebook screen */
    padding: clamp(8px, 1.4vh, 18px) clamp(10px, 2vw, 28px);
    overflow: hidden;
    box-shadow: none;
  }

  /* Left Panel: Interactive Workspace */
  .left-panel {
    flex: 1.2;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    border-right: 3px solid #e2e8f0;
    padding-right: clamp(10px, 2vw, 28px);
    min-width: 0;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    border-bottom: 2px solid #e2e8f0;
    padding-bottom: 1vh;
  }
  h1 { font-size: clamp(1.3rem, 2.8vw, 2.2rem); color: #0f172a; }
  #score-display { font-size: clamp(1.1rem, 2.2vw, 1.65rem); font-weight: 700; color: #475569; white-space: nowrap; }

  .workspace {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(10px, 2vw, 30px);
    background: #f8fafc;
    border: 2px solid #e2e8f0;
    border-radius: 8px;
    padding: clamp(8px, 2vh, 26px) clamp(8px, 2vw, 30px);
    flex-grow: 1;
    min-height: 0;
    margin: 1vh 0;
    flex-wrap: wrap;
  }
  .fraction-display {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    font-size: clamp(2.8rem, 8vh, 5.2rem);
    font-weight: 700;
    line-height: 1.1;
  }
  .fraction-top { border-bottom: 6px solid #1e293b; width: 100%; text-align: center; padding: 0 .15em 4px; }
  .fraction-bottom { width: 100%; text-align: center; padding-top: 4px; }
  .equals { font-size: clamp(2.6rem, 7.5vh, 5.2rem); font-weight: bold; color: #64748b; }

  .inputs {
    display: flex;
    align-items: center;
    gap: clamp(8px, 1vw, 16px);
  }
  input[type="number"], input[type="text"] {
    font-weight: 700;
    text-align: center;
    border: 3px solid #64748b;
    border-radius: 8px;
    outline: none;
    -moz-appearance: textfield;
    appearance: textfield;
    font-family: inherit;
  }
  input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input:focus { border-color: #2563eb; background: #eff6ff; }

  #whole-input { width: clamp(88px, 11vw, 146px); height: clamp(64px, 12.5vh, 112px); font-size: clamp(2.3rem, 6vh, 3.9rem); }
  .fraction-inputs { display: flex; flex-direction: column; gap: clamp(6px, 1.2vh, 10px); }
  .fraction-inputs input { width: clamp(126px, 15vw, 210px); height: clamp(38px, 6.2vh, 52px); font-size: clamp(1.35rem, 3.4vh, 2.05rem); }

  ::placeholder { font-size: clamp(.92rem, 2.2vh, 1.35rem); font-weight: normal; color: #94a3b8; }

  .action-row {
    display: flex;
    gap: clamp(8px, 1vw, 16px);
    margin-bottom: 1vh;
  }
  button {
    flex: 1;
    padding: clamp(8px, 1.3vh, 16px);
    font-size: clamp(1.12rem, 2.6vh, 1.65rem);
    font-weight: 700;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
  }
  #check-btn { background: #2563eb; color: #fff; }
  #check-btn:hover { background: #1d4ed8; }
  #next-btn { background: #64748b; color: #fff; }
  #next-btn:hover { background: #475569; }

  #feedback {
    font-size: clamp(1.3rem, 3.3vh, 2.05rem);
    font-weight: 700;
    text-align: center;
    min-height: 1.4em;
  }
  .correct { color: #16a34a; }
  .incorrect { color: #dc2626; }

  /* Right Panel: Division Visualizer */
  .right-panel {
    flex: 1;
    background: #f1f5f9;
    border: 3px dashed #93c5fd;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2vh 1vw;
    position: relative;
    min-width: 0;
  }
  .div-title {
    position: absolute;
    top: 1.2vh;
    font-size: clamp(1.1rem, 2.8vh, 1.95rem);
    font-weight: bold;
    color: #475569;
    text-transform: uppercase;
    letter-spacing: 2px;
    text-align: center;
  }

  .div-grid {
    display: grid;
    grid-template-columns: auto auto;
    grid-template-rows: auto auto;
    align-items: center;
    gap: 5px clamp(10px, 1.5vw, 20px);
    margin-top: 2.2vh;
  }

  .lbl { font-size: clamp(.88rem, 2vh, 1.28rem); color: #64748b; font-weight: bold; text-transform: uppercase; text-align: center; }
  .val { font-size: clamp(2.3rem, 5.8vh, 4.2rem); font-weight: bold; color: #0f172a; text-align: center; line-height: 1.15; }

  /* Quotient (Top) */
  .div-quotient-wrapper { grid-column: 2; grid-row: 1; display: flex; flex-direction: column; align-items: center; }
  .div-quotient-row { display: flex; align-items: baseline; gap: .35em; }
  .div-quotient-val { color: #16a34a; } /* Green for whole */
  .div-rem-inline { color: #dc2626; font-size: clamp(1.55rem, 3.8vh, 2.7rem); } /* Red remainder, US style "r 2" */

  /* Divisor (Left) */
  .div-divisor-wrapper { grid-column: 1; grid-row: 2; display: flex; flex-direction: column; align-items: center; padding-right: clamp(4px, 1vw, 12px); }

  /* Dividend (Inside Bracket) */
  /* The US long-division house: roof over the dividend, bracket on its left */
  .div-dividend-wrapper { grid-column: 2; grid-row: 2; display: flex; flex-direction: column; align-items: center;
    border-top: 5px solid #1e293b; border-left: 5px solid #1e293b; border-top-left-radius: 24px;
    padding: 8px 18px 4px 20px; }

  .div-note { margin-top: 1.4vh; font-size: clamp(1.05rem, 2.5vh, 1.45rem); font-weight: 700; color: #dc2626; text-align: center; }

  .hidden-step { visibility: hidden; }

  /* Short screens: compact mode */
  @media (max-height: 660px) {
    .fraction-display { font-size: clamp(2.2rem, 6.8vh, 3.6rem); }
    .val { font-size: clamp(1.9rem, 5vh, 3rem); }
    #whole-input { height: clamp(52px, 11vh, 84px); }
    .workspace { padding-top: 6px; padding-bottom: 6px; }
    .div-grid { margin-top: 1.2vh; }
    .right-panel { padding-top: 4.5vh; }
  }

  /* Narrow / portrait screens: stack the panels so everything still fits */
  @media (max-width: 860px) {
    body { align-items: flex-start; }
    #app-container { flex-direction: column; height: auto; min-height: calc(100dvh - 16px); }
    .left-panel { border-right: none; border-bottom: 3px solid #e2e8f0; padding-right: 0; padding-bottom: 2vh; }
    .right-panel { min-height: 34vh; padding-top: 5vh; }
    .fraction-display { font-size: clamp(2.4rem, 7vh, 4rem); }
  }
</style>
</head>
<body>

<div id="app-container">
  <!-- Left Side: Inputs -->
  <div class="left-panel">
    <div class="header">
      <h1>Improper → Mixed Number</h1>
      <span id="score-display">Solved: 0</span>
    </div>

    <div class="workspace">
      <div class="fraction-display">
        <div class="fraction-top" id="top-num">17</div>
        <div class="fraction-bottom" id="bot-num">5</div>
      </div>
      <div class="equals">=</div>
      <div class="inputs">
        <input type="number" id="whole-input" placeholder="Whole" inputmode="numeric" autofocus>
        <div class="fraction-inputs">
          <input type="number" id="rem-input" placeholder="Remainder" inputmode="numeric">
          <input type="number" id="den-input" placeholder="Denominator" inputmode="numeric">
        </div>
      </div>
    </div>

    <div class="action-row">
      <button id="check-btn" onclick="validate()">Check [Enter]</button>
      <button id="next-btn" onclick="nextProblem()">New Problem</button>
    </div>
    <div id="feedback"></div>
  </div>

  <!-- Right Side: Visual Division -->
  <div class="right-panel">
    <div class="div-title">Division Panel</div>
    <div class="div-grid">

      <!-- Quotient -->
      <div class="div-quotient-wrapper hidden-step" id="div-quot-wrap">
        <div class="lbl">Quotient (Whole)</div>
        <div class="div-quotient-row">
          <div class="val div-quotient-val" id="div-quot">3</div>
          <div class="val div-rem-inline" id="div-rem-inline">r 2</div>
        </div>
      </div>

      <!-- Divisor -->
      <div class="div-divisor-wrapper">
        <div class="lbl">Divisor<br>(Denominator)</div>
        <div class="val" id="div-divis">5</div>
      </div>

      <!-- Dividend -->
      <div class="div-dividend-wrapper">
        <div class="lbl">Dividend<br>(Numerator)</div>
        <div class="val" id="div-divid">17</div>
      </div>

    </div>
    <div class="div-note hidden-step" id="div-note">The remainder becomes the new numerator.</div>
  </div>
</div>

<script>
let currentNum = 0;
let currentDen = 0;
let solvedCount = 0;
let alreadySolved = false;

// Input Elements
const topNumEl = document.getElementById('top-num');
const botNumEl = document.getElementById('bot-num');
const wholeInput = document.getElementById('whole-input');
const remInput = document.getElementById('rem-input');
const denInput = document.getElementById('den-input');
const feedback = document.getElementById('feedback');
const scoreDisplay = document.getElementById('score-display');

// Division Panel Elements
const divDivis = document.getElementById('div-divis');
const divDivid = document.getElementById('div-divid');
const divQuot = document.getElementById('div-quot');
const divRemInline = document.getElementById('div-rem-inline');
const divQuotWrap = document.getElementById('div-quot-wrap');
const divNote = document.getElementById('div-note');

function nextProblem() {
  currentDen = Math.floor(Math.random() * 8) + 2;
  const wholePart = Math.floor(Math.random() * 6) + 1;
  const remainderPart = Math.floor(Math.random() * (currentDen - 1)) + 1;

  currentNum = (wholePart * currentDen) + remainderPart;
  alreadySolved = false;

  // Update Left Panel
  topNumEl.innerText = currentNum;
  botNumEl.innerText = currentDen;
  wholeInput.value = '';
  remInput.value = '';
  denInput.value = '';
  feedback.innerText = '';
  feedback.className = '';

  // Update Right Panel (Show Dividend/Divisor, Hide Answers)
  divDivid.innerText = currentNum;
  divDivis.innerText = currentDen;
  divQuotWrap.classList.add('hidden-step');
  divNote.classList.add('hidden-step');

  wholeInput.focus();
}

function revealDivision() {
  const quotient = Math.floor(currentNum / currentDen);
  const remainder = currentNum % currentDen;

  divQuot.innerText = quotient;
  divRemInline.innerText = 'r ' + remainder;
  divNote.innerText = 'Remainder ' + remainder + ' → the new numerator (denominator stays ' + currentDen + ').';

  divQuotWrap.classList.remove('hidden-step');
  divNote.classList.remove('hidden-step');
}

function validate() {
  const userWhole = parseInt(wholeInput.value, 10);
  const userRem = parseInt(remInput.value, 10);
  const userDen = parseInt(denInput.value, 10);

  if (isNaN(userWhole) || isNaN(userRem) || isNaN(userDen)) {
    feedback.innerText = 'Fill in all three boxes.';
    feedback.className = 'incorrect';
    return;
  }

  const expectedWhole = Math.floor(currentNum / currentDen);
  const expectedRem = currentNum % currentDen;
  const expectedDen = currentDen;

  // Reveal the correct math on the right regardless of whether they were right or wrong
  revealDivision();

  if (userWhole === expectedWhole && userRem === expectedRem && userDen === expectedDen) {
    feedback.innerText = '✓ Correct!  ' + currentNum + ' ÷ ' + currentDen + ' = ' + expectedWhole + ' r ' + expectedRem + '  →  ' + expectedWhole + ' ' + expectedRem + '/' + expectedDen;
    feedback.className = 'correct';
    if (!alreadySolved) {
      alreadySolved = true;
      solvedCount++;
      scoreDisplay.innerText = 'Solved: ' + solvedCount;
    }
  } else {
    feedback.innerText = '✗ Incorrect. Look at the division breakdown on the right.';
    feedback.className = 'incorrect';
  }
}

// Enter Key Progression
const inputList = [wholeInput, remInput, denInput];
inputList.forEach((input, index) => {
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      if (index < inputList.length - 1 && input.value !== '') {
        inputList[index + 1].focus();
      } else {
        validate();
      }
    }
  });
});

nextProblem();
</script>
</body>
</html>
