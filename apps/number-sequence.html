<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Number Sequence</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Comic Sans MS", "Comic Neue", "Chalkboard SE", Verdana, sans-serif;
    background: #ffffff;
    color: #1e293b;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 14px;
    overflow: hidden;
    user-select: none;
  }
  h1 {
    font-size: clamp(1.5rem, 4.5vw, 2.4rem);
    color: #0f172a;
    text-align: center;
    margin-bottom: 10px;
  }
  .subtitle {
    font-size: clamp(1rem, 3vw, 1.35rem);
    color: #475569;
    text-align: center;
    font-weight: 700;
    margin-bottom: 18px;
  }
  .seq { display: flex; gap: clamp(8px, 2vw, 16px); justify-content: center; flex-wrap: wrap; }
  .box {
    width: clamp(70px, 17vw, 120px);
    height: clamp(70px, 17vw, 120px);
    border: 4px solid #2563eb;
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(2.2rem, 8vw, 4rem);
    font-weight: 800;
    color: #0f172a;
    background: #ffffff;
  }
  .box.blank { border-style: dashed; border-color: #dc2626; color: #dc2626; background: #fef2f2; }
  .box.filled { border-style: solid; border-color: #16a34a; color: #16a34a; background: #f0fdf4; }
  .answers { display: flex; gap: 12px; margin-top: 26px; flex-wrap: wrap; justify-content: center; }
  .answers button {
    min-width: clamp(92px, 22vw, 140px);
    padding: clamp(14px, 2.4vh, 22px) 10px;
    font-size: clamp(2rem, 6vw, 3rem);
    font-weight: 800;
    border: 4px solid #94a3b8;
    background: #ffffff;
    color: #0f172a;
    border-radius: 18px;
    cursor: pointer;
    font-family: inherit;
  }
  .answers button.good { background: #22c55e; border-color: #16a34a; color: #ffffff; }
  .answers button.bad { background: #ef4444; border-color: #b91c1c; color: #ffffff; animation: shake 0.35s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-7px); }
    75% { transform: translateX(7px); }
  }
  .message {
    font-size: clamp(1.25rem, 3.4vw, 1.8rem);
    font-weight: 800;
    text-align: center;
    margin-top: 16px;
    min-height: 1.4em;
  }
  .message.good { color: #16a34a; }
  .stars { font-size: clamp(1.3rem, 3.4vw, 1.8rem); font-weight: 700; margin-top: 8px; min-height: 1.4em; }
</style>
</head>
<body>

<h1>Number Sequence</h1>
<div class="subtitle">What number is missing?</div>

<div class="seq" id="seq"></div>
<div class="answers" id="answers"></div>
<div class="message" id="message"></div>
<div class="stars" id="stars"></div>

<script>
let stars = 0;
let locked = false;
let cur = null;

const seqEl = document.getElementById('seq');
const answersEl = document.getElementById('answers');
const messageEl = document.getElementById('message');
const starsEl = document.getElementById('stars');

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function rnd(min, max) { return min + Math.floor(Math.random() * (max - min + 1)); }

function makeProblem() {
  const r = Math.random();
  let step, start;
  if (r < 0.55) {
    step = 1;  start = rnd(1, 110);
  } else if (r < 0.8) {
    step = -1; start = rnd(6, 120);
  } else {
    step = 10; start = rnd(1, 75);
  }
  const seq = [0, 1, 2, 3].map(i => start + i * step);
  const blankIdx = rnd(0, 3);
  return { seq: seq, blankIdx: blankIdx, answer: seq[blankIdx] };
}

function showProblem() {
  locked = false;
  cur = makeProblem();
  seqEl.innerHTML = '';
  cur.seq.forEach((n, i) => {
    const d = document.createElement('div');
    if (i === cur.blankIdx) {
      d.className = 'box blank';
      d.id = 'blank-box';
      d.textContent = '?';
    } else {
      d.className = 'box';
      d.textContent = n;
    }
    seqEl.appendChild(d);
  });
  messageEl.textContent = '';
  messageEl.classList.remove('good');

  const wrongs = shuffle([cur.answer - 2, cur.answer - 1, cur.answer + 1, cur.answer + 2, cur.answer - 10, cur.answer + 10]
    .filter(n => n !== cur.answer && n >= 0 && n <= 130)).slice(0, 2);
  const choices = shuffle([cur.answer].concat(wrongs));
  answersEl.innerHTML = '';
  choices.forEach(n => {
    const btn = document.createElement('button');
    btn.textContent = n;
    btn.addEventListener('click', (e) => { pick(n, btn); e.target.blur(); });
    answersEl.appendChild(btn);
  });
}

function pick(n, btn) {
  if (locked) return;
  if (n === cur.answer) {
    locked = true;
    btn.classList.add('good');
    const blank = document.getElementById('blank-box');
    blank.textContent = cur.answer;
    blank.classList.remove('blank');
    blank.classList.add('filled');
    stars++;
    starsEl.textContent = '⭐ × ' + stars;
    messageEl.textContent = '⭐ Yes! The missing number is ' + cur.answer + '!';
    messageEl.classList.add('good');
    setTimeout(showProblem, 1800);
  } else {
    btn.classList.add('bad');
    btn.disabled = true;
    messageEl.textContent = 'Try again!';
  }
}

showProblem();
</script>
</body>
</html>
