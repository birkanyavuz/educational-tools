<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Count-On Challenge - 1st Grade</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #f1f5f9;
    color: #0f172a;
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 1vh 1vw;
  }
  .app {
    background: #ffffff;
    width: 100%;
    max-width: 820px;
    border-radius: 10px;
    border: 3px solid #334155;
    padding: 12px 16px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .top-bar {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid #e2e8f0;
    padding-bottom: 6px;
  }
  h1 { font-size: 1.4rem; color: #1e3a8a; }
  .score { font-size: 1.1rem; font-weight: bold; color: #047857; background: #d1fae5; padding: 4px 10px; border-radius: 6px; }
  .strategy-banner {
    background: #fef9c3;
    border: 2px solid #eab308;
    border-radius: 8px;
    padding: 6px 14px;
    font-size: 1.15rem;
    font-weight: bold;
    color: #854d0e;
  }
  .equation-box {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    font-size: 2.8rem;
    font-weight: 800;
    padding: 10px 0;
  }
  .start-num {
    background: #dbeafe;
    border: 4px solid #2563eb;
    padding: 8px 20px;
    border-radius: 12px;
    color: #1e3a8a;
  }
  input {
    width: 95px;
    height: 74px;
    font-size: 2.5rem;
    font-weight: 800;
    text-align: center;
    border: 4px solid #9333ea;
    border-radius: 12px;
    background: #faf5ff;
    -moz-appearance: textfield;
  }
  input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input:focus { outline: none; border-color: #f59e0b; background: #fffbeb; }
  .dots-helper {
    min-height: 36px;
    display: flex;
    gap: 8px;
    align-items: center;
    justify-content: center;
  }
  .count-dot {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #9333ea;
    color: white;
    font-size: 0.95rem;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .feedback { min-height: 28px; font-size: 1.25rem; font-weight: bold; }
  .ok { color: #15803d; }
  .err { color: #b91c1c; }
</style>
</head>
<body>
<div class="app">
  <div class="top-bar">
    <h1>✊ Count-On Missing Partner</h1>
    <div class="score">Solved: <span id="solved">0</span></div>
  </div>
  <div class="strategy-banner" id="prompt-banner">Put 5 in your fist, and count on to 9!</div>
  <div class="equation-box">
    <span class="start-num" id="start-num">5</span>
    <span>+</span>
    <input type="number" id="missing-input" placeholder="?" autocomplete="off">
    <span>=</span>
    <span id="target-num">9</span>
  </div>
  <div class="dots-helper" id="dots-helper"></div>
  <div class="feedback" id="feedback">How many fingers did you count on? Press Enter!</div>
</div>

<script>
  let start = 5, target = 9, ans = 4, solved = 0, waiting = false;
  const startEl = document.getElementById('start-num');
  const targetEl = document.getElementById('target-num');
  const bannerEl = document.getElementById('prompt-banner');
  const inputEl = document.getElementById('missing-input');
  const dotsEl = document.getElementById('dots-helper');
  const fbEl = document.getElementById('feedback');
  const solvedEl = document.getElementById('solved');

  function showCountOnDots() {
    dotsEl.innerHTML = '';
    for (let i = 1; i <= ans; i++) {
      const d = document.createElement('div');
      d.className = 'count-dot';
      d.textContent = start + i;
      dotsEl.appendChild(d);
    }
  }

  function generate() {
    target = Math.floor(Math.random() * 6) + 5; // 5 to 10
    start = Math.floor(Math.random() * (target - 1)) + 1;
    ans = target - start;
    startEl.textContent = start;
    targetEl.textContent = target;
    bannerEl.textContent = `Put ${start} in your fist, and count on up to ${target}!`;
    dotsEl.innerHTML = '';
    inputEl.value = '';
    inputEl.disabled = false;
    fbEl.textContent = 'Type the missing number and press Enter.';
    fbEl.className = 'feedback';
    waiting = false;
    inputEl.focus();
  }

  function checkAns() {
    const val = parseInt(inputEl.value, 10);
    if (isNaN(val)) return;
    showCountOnDots();
    if (val === ans) {
      solved++;
      solvedEl.textContent = solved;
      fbEl.textContent = `Yes! Counting on ${ans} gets you from ${start} to ${target}. [Press Enter for Next]`;
      fbEl.className = 'feedback ok';
      inputEl.disabled = true;
      waiting = true;
    } else {
      fbEl.textContent = `Look at the purple count-on circles above and count how many there are!`;
      fbEl.className = 'feedback err';
      inputEl.value = '';
      inputEl.focus();
    }
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      if (waiting) generate();
      else checkAns();
    }
  });

  window.onload = generate;
</script>
</body>
</html>
