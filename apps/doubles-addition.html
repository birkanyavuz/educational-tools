<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Near Doubles</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Comic Sans MS", "Comic Neue", "Chalkboard SE", Verdana, sans-serif;
    background: #ffffff;
    color: #1e293b;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 14px;
    overflow: hidden;
    user-select: none;
  }
  h1 {
    font-size: clamp(1.5rem, 4.5vw, 2.4rem);
    color: #0f172a;
    text-align: center;
    margin-bottom: 12px;
  }

  /* Mode buttons */
  .modes { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-bottom: 16px; }
  .modes button {
    padding: 12px 20px;
    font-size: clamp(1.1rem, 3vw, 1.5rem);
    font-weight: 700;
    border: 3px solid #2563eb;
    background: #ffffff;
    color: #2563eb;
    border-radius: 999px;
    cursor: pointer;
    font-family: inherit;
  }
  .modes button.active { background: #2563eb; color: #ffffff; }

  /* Problem */
  .problem {
    font-size: clamp(3.2rem, 13vw, 6.5rem);
    font-weight: 800;
    color: #0f172a;
    text-align: center;
    line-height: 1.1;
  }
  .problem .q { color: #2563eb; }

  /* Dots — rows start at the same left edge so the columns line up */
  .dots {
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: flex-start;
    width: fit-content;
    margin: 14px auto 4px auto;
    min-height: 76px;
  }
  .dotrow { display: flex; gap: 7px; justify-content: flex-start; }
  .dot { width: clamp(20px, 4.5vw, 30px); height: clamp(20px, 4.5vw, 30px); border-radius: 50%; flex: none; }
  .dot.a { background: #3b82f6; }
  .dot.b { background: #f97316; }
  .dot.extra { background: #22c55e; box-shadow: 0 0 0 3px #bbf7d0; }

  /* Answer buttons */
  .answers { display: flex; gap: 12px; margin-top: 16px; flex-wrap: wrap; justify-content: center; }
  .answers button {
    min-width: clamp(92px, 22vw, 140px);
    padding: clamp(14px, 2.4vh, 22px) 10px;
    font-size: clamp(2rem, 6vw, 3rem);
    font-weight: 800;
    border: 4px solid #94a3b8;
    background: #ffffff;
    color: #0f172a;
    border-radius: 18px;
    cursor: pointer;
    font-family: inherit;
  }
  .answers button.good { background: #22c55e; border-color: #16a34a; color: #ffffff; }
  .answers button.bad { background: #ef4444; border-color: #b91c1c; color: #ffffff; animation: shake 0.35s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-7px); }
    75% { transform: translateX(7px); }
  }

  .message {
    font-size: clamp(1.25rem, 3.4vw, 1.8rem);
    font-weight: 800;
    text-align: center;
    margin-top: 14px;
    min-height: 1.4em;
  }
  .message.good { color: #16a34a; }

  .bottom { display: flex; gap: 14px; align-items: center; margin-top: 10px; }
  .stars { font-size: clamp(1.3rem, 3.4vw, 1.8rem); font-weight: 700; min-height: 1.4em; }
  #hear-btn {
    padding: 10px 18px;
    font-size: clamp(1.05rem, 2.8vw, 1.35rem);
    font-weight: 700;
    border: none;
    border-radius: 999px;
    background: #f59e0b;
    color: #ffffff;
    cursor: pointer;
    font-family: inherit;
  }
</style>
</head>
<body>

<h1>Near Doubles</h1>

<div class="modes">
  <button id="mode-plus" class="active">Doubles + 1</button>
  <button id="mode-minus">Doubles − 1</button>
  <button id="mode-mix">🎲 Mix</button>
</div>

<div class="problem" id="problem"></div>

<div class="dots">
  <div class="dotrow" id="dots-a"></div>
  <div class="dotrow" id="dots-b"></div>
</div>

<div class="answers" id="answers"></div>

<div class="message" id="message"></div>

<div class="bottom">
  <div class="stars" id="stars"></div>
  <button id="hear-btn">🔊 Hear it</button>
</div>

<script>
let mode = 'plus'; // 'plus' | 'minus' | 'mix'
let bag = [];
let cur = null;    // {a, b, dbl, kind, sum}
let stars = 0;
let locked = false;

const problemEl = document.getElementById('problem');
const dotsA = document.getElementById('dots-a');
const dotsB = document.getElementById('dots-b');
const answersEl = document.getElementById('answers');
const messageEl = document.getElementById('message');
const starsEl = document.getElementById('stars');

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function buildBag() {
  const list = [];
  if (mode === 'plus' || mode === 'mix') {
    for (let d = 1; d <= 10; d++) list.push({ dbl: d, kind: 'plus' });
  }
  if (mode === 'minus' || mode === 'mix') {
    for (let d = 2; d <= 10; d++) list.push({ dbl: d, kind: 'minus' });
  }
  return shuffle(list);
}

function makeProblem() {
  if (bag.length === 0) bag = buildBag();
  const p = bag.pop();
  const d = p.dbl;
  let a, b;
  if (p.kind === 'plus') { a = d; b = d + 1; }
  else { a = d; b = d - 1; }
  if (Math.random() < 0.5) { const t = a; a = b; b = t; } // mix up the order
  return { a: a, b: b, dbl: d, kind: p.kind, sum: a + b };
}

function drawDots(el, count, cls, extraLast) {
  el.innerHTML = '';
  for (let i = 0; i < count; i++) {
    const s = document.createElement('span');
    s.className = 'dot ' + cls + (extraLast && i === count - 1 ? ' extra' : '');
    el.appendChild(s);
  }
}

function speak(text) {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 0.9;
  const voices = speechSynthesis.getVoices();
  const best = voices.find(v => /google us english/i.test(v.name))
    || voices.find(v => /^en[-_]US/i.test(v.lang))
    || voices.find(v => /^en/i.test(v.lang));
  if (best) u.voice = best;
  speechSynthesis.speak(u);
}

function showProblem() {
  locked = false;
  cur = makeProblem();
  problemEl.innerHTML = cur.a + ' + ' + cur.b + ' = <span class="q">?</span>';
  // The green dot is the "+1" (the bigger side's last dot)
  drawDots(dotsA, cur.a, 'a', cur.a > cur.dbl);
  drawDots(dotsB, cur.b, 'b', cur.b > cur.dbl);
  messageEl.textContent = '';
  messageEl.classList.remove('good');

  const wrongs = shuffle([cur.sum - 2, cur.sum - 1, cur.sum + 1, cur.sum + 2]
    .filter(n => n !== cur.sum && n >= 0)).slice(0, 2);
  const choices = shuffle([cur.sum].concat(wrongs));
  answersEl.innerHTML = '';
  choices.forEach(n => {
    const btn = document.createElement('button');
    btn.textContent = n;
    btn.addEventListener('click', (e) => { pick(n, btn); e.target.blur(); });
    answersEl.appendChild(btn);
  });
}

function pick(n, btn) {
  if (locked) return;
  if (n === cur.sum) {
    locked = true;
    btn.classList.add('good');
    stars++;
    starsEl.textContent = '⭐ × ' + stars;
    messageEl.textContent = '⭐ Yes! ' + cur.a + ' + ' + cur.b + ' = ' + cur.sum;
    messageEl.classList.add('good');
    speak(cur.a + ' plus ' + cur.b + ' equals ' + cur.sum);
    setTimeout(showProblem, 1800);
  } else {
    btn.classList.add('bad');
    btn.disabled = true;
    messageEl.textContent = 'Try again!';
  }
}

function setMode(m, btn) {
  mode = m;
  bag = [];
  document.querySelectorAll('.modes button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  btn.blur();
  showProblem();
}

document.getElementById('mode-plus').addEventListener('click', (e) => setMode('plus', e.target));
document.getElementById('mode-minus').addEventListener('click', (e) => setMode('minus', e.target));
document.getElementById('mode-mix').addEventListener('click', (e) => setMode('mix', e.target));
document.getElementById('hear-btn').addEventListener('click', (e) => {
  if (cur) speak('What is ' + cur.a + ' plus ' + cur.b + '?');
  e.target.blur();
});

showProblem();
</script>
</body>
</html>
