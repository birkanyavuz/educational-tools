<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polyomino Area & Perimeter</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 5px; /* Shrunk from 20px */
            margin: 0;
            background-color: #eef2f5;
            color: #333;
        }
        .container { 
            max-width: 650px; 
            width: 100%; 
            background: white; 
            padding: 15px; /* Shrunk from 40px */
            border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
        }
        h1 { text-align: center; color: #2c3e50; margin: 0 0 10px 0; font-size: 1.5rem; }
        
        /* Compact Grid Styling */
        #grid-container {
            display: flex;
            justify-content: center;
            margin-bottom: 10px; /* Shrunk from 30px */
        }
        #grid { 
            display: grid; 
            grid-template-columns: repeat(12, 25px); /* Shrunk from 30px */
            grid-template-rows: repeat(12, 25px);    /* Shrunk from 30px */
            gap: 1px; 
            background-color: #dfe6e9; 
            border: 3px solid #2c3e50; 
        }
        .cell { 
            width: 25px; 
            height: 25px; 
            background-color: white; 
        }
        .filled { 
            background-color: #3498db; 
            box-shadow: inset 0 0 0 2px rgba(0,0,0,0.1);
        }

        /* Tightened Controls */
        .controls {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }
        .btn { 
            padding: 8px 15px; 
            font-size: 14px; 
            font-weight: bold;
            cursor: pointer; 
            border: none; 
            border-radius: 6px; 
            flex: 1;
        }
        .btn-gen { background-color: #2c3e50; color: white; }
        .btn-check { background-color: #27ae60; color: white; }

        /* Input Sections */
        .qa-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 5px;
        }
        .card {
            background: #f8f9fa;
            padding: 10px; /* Shrunk from 20px */
            border-radius: 8px;
            border-left: 5px solid #bdc3c7;
        }
        .card h2 { margin: 0; font-size: 1.1rem; }
        .card p { margin: 3px 0; font-size: 0.8rem; }
        .input-group { margin: 8px 0; }
        input[type="number"] {
            padding: 5px;
            width: 60px;
            font-size: 14px;
        }
        
        .solution { 
            display: none; 
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #ddd;
            font-size: 0.9rem;
        }
        .correct { color: #27ae60; font-weight: bold; }
        .incorrect { color: #c0392b; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>Shape Geometry</h1>
    
    <div id="grid-container">
        <div id="grid"></div>
    </div>

    <div class="controls">
        <button class="btn btn-gen" onclick="generateShape()">New Shape</button>
        <button class="btn btn-check" onclick="checkAnswers()">Check</button>
    </div>

    <div class="qa-section">
        <div class="card" style="border-left-color: #3498db;">
            <h2>Area</h2>
            <p style="color: #666;">Total colored squares.</p>
            <div class="input-group">
                <input type="number" id="area-input" placeholder="0">
            </div>
            <div id="area-solution" class="solution">
                <div id="area-feedback"></div>
                <strong>Ans:</strong> <span id="area-val"></span> sq units
            </div>
        </div>

        <div class="card" style="border-left-color: #e67e22;">
            <h2>Perimeter</h2>
            <p style="color: #666;">Total outer edges.</p>
            <div class="input-group">
                <input type="number" id="perimeter-input" placeholder="0">
            </div>
            <div id="perimeter-solution" class="solution">
                <div id="perimeter-feedback"></div>
                <strong>Ans:</strong> <span id="perimeter-val"></span> units
            </div>
        </div>
    </div>
</div>

<script>
    const gridSize = 12;
    let currentShape = [];
    let correctArea = 0;
    let correctPerimeter = 0;

    const tetrominoes = [
        [[0,0], [0,1], [1,0], [1,1]], // O
        [[0,0], [1,0], [2,0], [3,0]], // I
        [[0,0], [1,0], [2,0], [2,1]], // L
        [[0,0], [1,0], [2,0], [0,1]], // J
        [[1,0], [0,1], [1,1], [2,1]], // T
        [[1,0], [2,0], [0,1], [1,1]], // S
        [[0,0], [1,0], [1,1], [2,1]]  // Z
    ];

    function initGrid() {
        const grid = document.getElementById('grid');
        grid.innerHTML = '';
        for (let i = 0; i < gridSize * gridSize; i++) {
            const cell = document.createElement('div');
            cell.classList.add('cell');
            cell.id = `cell-${i}`;
            grid.appendChild(cell);
        }
    }

    function generateShape() {
        document.getElementById('area-solution').style.display = 'none';
        document.getElementById('perimeter-solution').style.display = 'none';
        document.getElementById('area-input').value = '';
        document.getElementById('perimeter-input').value = '';
        initGrid();
        currentShape = [];
        const piecesCount = Math.random() > 0.5 ? 2 : 3;
        for (let i = 0; i < piecesCount; i++) {
            addRandomTetromino(i === 0);
        }
        drawShape();
        calculateMetrics();
    }

    function addRandomTetromino(isFirst) {
        let placed = false;
        let attempts = 0;
        while (!placed && attempts < 50) {
            attempts++;
            const template = tetrominoes[Math.floor(Math.random() * tetrominoes.length)];
            let originX, originY;
            if (isFirst) {
                originX = 4; originY = 4;
            } else {
                const anchor = currentShape[Math.floor(Math.random() * currentShape.length)];
                originX = anchor.x + (Math.floor(Math.random() * 5) - 2);
                originY = anchor.y + (Math.floor(Math.random() * 5) - 2);
            }
            let newCells = [];
            let isValid = true;
            for (let t of template) {
                let absX = originX + t[0];
                let absY = originY + t[1];
                if (absX < 0 || absX >= gridSize || absY < 0 || absY >= gridSize) {
                    isValid = false; break;
                }
                if (currentShape.some(s => s.x === absX && s.y === absY)) {
                   isValid = false; break;
                }
                newCells.push({x: absX, y: absY});
            }
            if (isValid && !isFirst) {
                let touches = false;
                for (let nc of newCells) {
                    const neighbors = [{x: nc.x+1, y: nc.y}, {x: nc.x-1, y: nc.y}, {x: nc.x, y: nc.y+1}, {x: nc.x, y: nc.y-1}];
                    if (neighbors.some(n => currentShape.some(s => s.x === n.x && s.y === n.y))) touches = true;
                }
                if (!touches) isValid = false;
            }
            if (isValid) {
                currentShape.push(...newCells);
                placed = true;
            }
        }
    }

    function drawShape() {
        for (let cell of currentShape) {
            const index = cell.y * gridSize + cell.x;
            const el = document.getElementById(`cell-${index}`);
            if(el) el.classList.add('filled');
        }
    }

    function calculateMetrics() {
        correctArea = currentShape.length;
        correctPerimeter = 0;
        for (let cell of currentShape) {
            const neighbors = [{x: cell.x + 1, y: cell.y}, {x: cell.x - 1, y: cell.y}, {x: cell.x, y: cell.y + 1}, {x: cell.x, y: cell.y - 1}];
            let edges = 4;
            for (let n of neighbors) {
                if (currentShape.some(s => s.x === n.x && s.y === n.y)) edges--;
            }
            correctPerimeter += edges;
        }
        document.getElementById('area-val').innerText = correctArea;
        document.getElementById('perimeter-val').innerText = correctPerimeter;
    }

    function checkAnswers() {
        const areaGuess = parseInt(document.getElementById('area-input').value);
        const perimGuess = parseInt(document.getElementById('perimeter-input').value);
        document.getElementById('area-solution').style.display = 'block';
        document.getElementById('perimeter-solution').style.display = 'block';
        document.getElementById('area-feedback').innerHTML = areaGuess === correctArea ? "<span class='correct'>✓</span>" : "<span class='incorrect'>✗</span>";
        document.getElementById('perimeter-feedback').innerHTML = perimGuess === correctPerimeter ? "<span class='correct'>✓</span>" : "<span class='incorrect'>✗</span>";
    }

    window.onload = generateShape;
</script>
</body>
</html>
