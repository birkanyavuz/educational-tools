<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ten-Frame Addition - 1st Grade</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #f1f5f9;
    color: #0f172a;
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 1vh 1vw;
  }
  .app {
    background: #ffffff;
    width: 100%;
    max-width: 820px;
    border-radius: 10px;
    border: 3px solid #334155;
    padding: 10px 16px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .top-bar {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid #e2e8f0;
    padding-bottom: 6px;
  }
  h1 { font-size: 1.4rem; color: #1e3a8a; }
  .score { font-size: 1.1rem; font-weight: bold; color: #047857; background: #d1fae5; padding: 4px 10px; border-radius: 6px; }
  .ten-frame {
    display: grid;
    grid-template-columns: repeat(5, 68px);
    grid-template-rows: repeat(2, 68px);
    border: 4px solid #0f172a;
    background: #f8fafc;
  }
  .cell {
    border: 2px solid #334155;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .chip {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 3px solid rgba(0,0,0,0.25);
  }
  .red { background: #ef4444; }
  .yellow { background: #facc15; }
  .eq-row {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 2.2rem;
    font-weight: 800;
  }
  .num-red { color: #dc2626; }
  .num-yellow { color: #ca8a04; }
  input {
    width: 90px;
    height: 64px;
    font-size: 2.2rem;
    font-weight: 800;
    text-align: center;
    border: 4px solid #2563eb;
    border-radius: 10px;
    background: #eff6ff;
    -moz-appearance: textfield;
  }
  input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input:focus { outline: none; border-color: #f59e0b; background: #fffbeb; }
  .feedback { min-height: 28px; font-size: 1.25rem; font-weight: bold; }
  .ok { color: #15803d; }
  .err { color: #b91c1c; }
</style>
</head>
<body>
<div class="app">
  <div class="top-bar">
    <h1>🔟 Ten-Frame Fast Addition</h1>
    <div class="score">Correct: <span id="score">0</span></div>
  </div>
  <div class="ten-frame" id="frame"></div>
  <div class="eq-row">
    <span class="num-red" id="a-txt">4</span>
    <span>+</span>
    <span class="num-yellow" id="b-txt">3</span>
    <span>=</span>
    <input type="number" id="sum-input" placeholder="?" autocomplete="off">
  </div>
  <div class="feedback" id="fb">Count the red and yellow counters, type the total, and press Enter!</div>
</div>

<script>
  let a = 4, b = 3, score = 0, waiting = false;
  const frame = document.getElementById('frame');
  const aTxt = document.getElementById('a-txt');
  const bTxt = document.getElementById('b-txt');
  const input = document.getElementById('sum-input');
  const fb = document.getElementById('fb');
  const scoreEl = document.getElementById('score');

  function nextProb() {
    a = Math.floor(Math.random() * 6) + 1;
    b = Math.floor(Math.random() * (10 - a)) + 1;
    aTxt.textContent = a;
    bTxt.textContent = b;
    frame.innerHTML = '';
    for (let i = 0; i < 10; i++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      if (i < a) {
        const c = document.createElement('div');
        c.className = 'chip red';
        cell.appendChild(c);
      } else if (i < a + b) {
        const c = document.createElement('div');
        c.className = 'chip yellow';
        cell.appendChild(c);
      }
      frame.appendChild(cell);
    }
    input.value = '';
    input.disabled = false;
    fb.textContent = 'Type the total and press Enter.';
    fb.className = 'feedback';
    waiting = false;
    input.focus();
  }

  function verify() {
    const val = parseInt(input.value, 10);
    if (isNaN(val)) return;
    if (val === a + b) {
      score++;
      scoreEl.textContent = score;
      fb.textContent = `Awesome! ${a} + ${b} = ${a + b}. [Press Enter for Next]`;
      fb.className = 'feedback ok';
      input.disabled = true;
      waiting = true;
    } else {
      fb.textContent = `Count all the circles in the 10-frame and try again!`;
      fb.className = 'feedback err';
      input.value = '';
      input.focus();
    }
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      if (waiting) nextProb();
      else verify();
    }
  });

  window.onload = nextProb;
</script>
</body>
</html>
