<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Segmenting</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Comic Sans MS", "Comic Neue", "Chalkboard SE", Verdana, sans-serif;
    background: #ffffff;
    color: #1e293b;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 8px 14px 14px 14px;
    overflow: hidden;
    user-select: none;
  }
  h1 {
    font-size: clamp(1.5rem, 4.5vw, 2.4rem);
    color: #0f172a;
    text-align: center;
    margin-bottom: 6px;
  }
  .subtitle {
    font-size: clamp(1rem, 3vw, 1.35rem);
    color: #475569;
    text-align: center;
    font-weight: 700;
    margin-bottom: 12px;
  }
  .photo {
    width: min(340px, 70vw);
    height: min(240px, 40vh);
    object-fit: cover;
    border-radius: 20px;
    border: 4px solid #2563eb;
    background: #ffffff;
  }
  .photo-emoji {
    font-size: 110px;
    line-height: 1;
    display: none;
  }
  #hear-btn {
    margin-top: 12px;
    padding: 12px 24px;
    font-size: clamp(1.1rem, 3vw, 1.5rem);
    font-weight: 800;
    border: none;
    border-radius: 999px;
    background: #f59e0b;
    color: #ffffff;
    cursor: pointer;
    font-family: inherit;
  }

  /* Sound boxes */
  .boxes { display: flex; gap: 12px; margin-top: 16px; }
  .sbox {
    width: clamp(64px, 16vw, 96px);
    height: clamp(64px, 16vw, 96px);
    border: 4px dashed #94a3b8;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(2.2rem, 7vw, 3.4rem);
    font-weight: 800;
    color: #0f172a;
    background: #ffffff;
  }
  .sbox.filled { border-style: solid; border-color: #16a34a; background: #f0fdf4; color: #16a34a; }

  /* Letter tiles */
  .tiles { display: flex; gap: 12px; margin-top: 16px; }
  .tile {
    width: clamp(64px, 16vw, 96px);
    height: clamp(64px, 16vw, 96px);
    border: 4px solid #2563eb;
    border-radius: 16px;
    background: #ffffff;
    color: #2563eb;
    font-size: clamp(2.2rem, 7vw, 3.4rem);
    font-weight: 800;
    cursor: pointer;
    font-family: inherit;
  }
  .tile.used { visibility: hidden; }
  .tile.bad { animation: shake 0.35s; border-color: #b91c1c; color: #b91c1c; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-7px); }
    75% { transform: translateX(7px); }
  }

  .message {
    font-size: clamp(1.25rem, 3.4vw, 1.8rem);
    font-weight: 800;
    text-align: center;
    margin-top: 14px;
    min-height: 1.4em;
  }
  .message.good { color: #16a34a; }
  .stars { font-size: clamp(1.3rem, 3.4vw, 1.8rem); font-weight: 700; margin-top: 6px; min-height: 1.4em; }
</style>
</head>
<body>

<h1>Word Segmenting</h1>
<div class="subtitle">Listen to the word. Tap the sounds in order.</div>

<img class="photo" id="photo" alt="">
<div class="photo-emoji" id="photo-emoji"></div>
<button id="hear-btn">🔊 Hear it</button>

<div class="boxes" id="boxes"></div>
<div class="tiles" id="tiles"></div>

<div class="message" id="message"></div>
<div class="stars" id="stars"></div>

let bag = [];
let cur = null;      // current word
let pos = 0;         // next sound position to fill
let stars = 0;
let locked = false;

const photoEl = document.getElementById('photo');
const emojiEl = document.getElementById('photo-emoji');
const boxesEl = document.getElementById('boxes');
const tilesEl = document.getElementById('tiles');
const messageEl = document.getElementById('message');
const starsEl = document.getElementById('stars');

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function speak(text) {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 0.8;
  const voices = speechSynthesis.getVoices();
  const best = voices.find(v => /google us english/i.test(v.name))
    || voices.find(v => /^en[-_]US/i.test(v.lang))
    || voices.find(v => /^en/i.test(v.lang));
  if (best) u.voice = best;
  speechSynthesis.speak(u);
}

function nextWord() {
  if (bag.length === 0) bag = shuffle(Object.keys(DATA));
  return bag.pop();
}

function showWord() {
  locked = false;
  pos = 0;
  cur = nextWord();
  const entry = DATA[cur];
  photoEl.style.display = 'block';
  emojiEl.style.display = 'none';
  photoEl.onerror = () => {
    photoEl.style.display = 'none';
    emojiEl.textContent = entry[1];
    emojiEl.style.display = 'block';
  };
  photoEl.src = entry[0];
  photoEl.alt = cur;
  messageEl.textContent = '';
  messageEl.classList.remove('good');

  boxesEl.innerHTML = '';
  for (let i = 0; i < cur.length; i++) {
    const d = document.createElement('div');
    d.className = 'sbox';
    d.id = 'sbox-' + i;
    boxesEl.appendChild(d);
  }

  tilesEl.innerHTML = '';
  shuffle(cur.split('')).forEach(ch => {
    const btn = document.createElement('button');
    btn.className = 'tile';
    btn.textContent = ch;
    btn.addEventListener('click', (e) => { tapTile(ch, btn); e.target.blur(); });
    tilesEl.appendChild(btn);
  });

  speak(cur);
}

function tapTile(ch, btn) {
  if (locked || btn.classList.contains('used')) return;
  if (ch === cur[pos]) {
    const box = document.getElementById('sbox-' + pos);
    box.textContent = ch;
    box.classList.add('filled');
    btn.classList.add('used');
    pos++;
    if (pos === cur.length) {
      locked = true;
      stars++;
      starsEl.textContent = '⭐ × ' + stars;
      messageEl.textContent = '⭐ Yes! ' + cur.split('').join(' – ') + ' … ' + cur + '!';
      messageEl.classList.add('good');
      speak(cur);
      setTimeout(showWord, 2000);
    }
  } else {
    btn.classList.remove('bad');
    void btn.offsetWidth; // restart the shake animation
    btn.classList.add('bad');
  }
}

document.getElementById('hear-btn').addEventListener('click', (e) => {
  if (cur) speak(cur);
  e.target.blur();
});

showWord();
</script>
