<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sight Words</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #ffffff;
    color: #1e293b;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
    overflow: hidden;
    user-select: none;
  }
  h1 {
    font-size: clamp(1.6rem, 4.5vw, 2.6rem);
    color: #0f172a;
    text-align: center;
    margin-bottom: 16px;
  }

  /* Progress */
  .progress { width: min(92vw, 620px); margin-bottom: 18px; }
  .progress-text {
    display: flex;
    justify-content: space-between;
    font-size: clamp(1.15rem, 2.8vw, 1.55rem);
    font-weight: 700;
    margin-bottom: 8px;
  }
  .bar { height: 20px; background: #e2e8f0; border-radius: 999px; overflow: hidden; }
  .bar-fill { height: 100%; width: 0%; background: #22c55e; border-radius: 999px; transition: width 0.4s ease; }

  /* Word card */
  .card {
    width: min(92vw, 620px);
    min-height: clamp(220px, 36vh, 320px);
    background: #eff6ff;
    border: 4px solid #2563eb;
    border-radius: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    cursor: pointer;
  }
  .word {
    font-size: clamp(3.8rem, 17vw, 9.5rem);
    font-weight: 800;
    color: #0f172a;
    line-height: 1.1;
    text-align: center;
  }
  .word.done { color: #16a34a; }

  /* Buttons */
  .buttons { display: flex; gap: 12px; width: min(92vw, 620px); margin-top: 18px; flex-wrap: wrap; }
  .buttons button {
    flex: 1;
    min-width: 150px;
    padding: clamp(16px, 2.6vh, 24px) 10px;
    font-size: clamp(1.3rem, 3.2vw, 1.75rem);
    font-weight: 700;
    border: none;
    border-radius: 16px;
    cursor: pointer;
    font-family: inherit;
  }
  #hear-btn { background: #f59e0b; color: #fff; }
  #got-btn { background: #22c55e; color: #fff; }
  #later-btn { background: #e2e8f0; color: #334155; }

  .stars {
    font-size: clamp(1.4rem, 3.6vw, 2rem);
    font-weight: 700;
    text-align: center;
    margin-top: 16px;
    min-height: 1.4em;
  }
  .message {
    font-size: clamp(1.3rem, 3.2vw, 1.8rem);
    font-weight: 700;
    text-align: center;
    margin-top: 10px;
    min-height: 1.4em;
  }
  .celebrate { color: #16a34a; }

  #again-btn {
    display: none;
    background: #2563eb;
    color: #fff;
    margin-top: 18px;
    width: min(92vw, 620px);
    padding: clamp(16px, 2.6vh, 24px) 10px;
    font-size: clamp(1.3rem, 3.2vw, 1.75rem);
    font-weight: 700;
    border: none;
    border-radius: 16px;
    cursor: pointer;
    font-family: inherit;
  }
</style>
</head>
<body>

<h1>Sight Words</h1>

<div class="progress">
  <div class="progress-text">
    <span id="progress-label">Words read: 0 of 315</span>

  </div>
  <div class="bar"><div class="bar-fill" id="bar-fill"></div></div>
</div>

<div class="card" id="card">
  <div class="word" id="word"></div>
</div>

<div class="buttons" id="buttons">
  <button id="hear-btn">🔊 Hear it</button>
  <button id="got-btn">✓ I read it!</button>
  <button id="later-btn">↻ Try later</button>
</div>

<div class="stars" id="stars"></div>
<div class="message" id="message"></div>
<button id="again-btn">🔄 Play again</button>

oded/6/65/En-au-wood.ogg/En-au-wood.ogg.mp3", "hill": "https://upload.wikimedia.org/wikipedia/commons/transcoded/c/cb/En-us-hill.ogg/En-us-hill.ogg.mp3"};

let queue = [];
let readCount = 0;
let current = "";
let advancing = false;
let playingAudio = null;
let preloadedAudio = null;

const wordEl = document.getElementById('word');
const progressLabel = document.getElementById('progress-label');
const leftLabel = document.getElementById('left-label');
const barFill = document.getElementById('bar-fill');
const starsEl = document.getElementById('stars');
const messageEl = document.getElementById('message');
const buttonsEl = document.getElementById('buttons');
const againBtn = document.getElementById('again-btn');

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function stopAudio() {
  speechSynthesis.cancel();
  if (playingAudio) { playingAudio.pause(); playingAudio = null; }
}

function speakWithVoice() {
  stopAudio();
  const u = new SpeechSynthesisUtterance(current);
  u.rate = 0.85;
  const voices = speechSynthesis.getVoices();
  const best = voices.find(v => /google us english/i.test(v.name))
    || voices.find(v => /^en[-_]US/i.test(v.lang))
    || voices.find(v => /^en/i.test(v.lang));
  if (best) u.voice = best;
  speechSynthesis.speak(u);
}

function playRecording(url, retried) {
  stopAudio();
  const a = new Audio(url);
  playingAudio = a;
  a.onerror = () => {
    if (!retried) {
      // Wikimedia sometimes 404s a fresh transcode on first hit; one retry fixes it
      setTimeout(() => playRecording(url, true), 800);
    } else {
      speakWithVoice();
    }
  };
  a.play().catch(() => speakWithVoice());
}

function speakWord() {
  if (!current) return;
  const url = AUDIO[current];
  if (url) {
    if (preloadedAudio && preloadedAudio.src === url) {
      stopAudio();
      playingAudio = preloadedAudio;
      preloadedAudio = null;
      playingAudio.onerror = () => playRecording(url, false);
      playingAudio.play().catch(() => playRecording(url, false));
    } else {
      playRecording(url, false);
    }
  } else {
    speakWithVoice();
  }
}

function updateProgress() {
  progressLabel.textContent = 'Words read: ' + readCount + ' of ' + WORDS.length;
  leftLabel.textContent = queue.length + ' left';
  barFill.style.width = (readCount / WORDS.length * 100) + '%';
  starsEl.textContent = readCount > 0 ? '⭐ × ' + readCount : '';
}

function showNext() {
  advancing = false;
  if (queue.length === 0) {
    wordEl.textContent = '🎉';
    wordEl.classList.add('done');
    messageEl.textContent = 'Amazing reading! You did it! 🎉';
    messageEl.classList.add('celebrate');
    buttonsEl.style.display = 'none';
    againBtn.style.display = 'block';
    updateProgress();
    return;
  }
  current = queue[0];
  wordEl.textContent = current;
  wordEl.classList.remove('done');
  messageEl.textContent = '';
  if (AUDIO[current]) {
    preloadedAudio = new Audio(AUDIO[current]);
    preloadedAudio.preload = 'auto';
  }
  updateProgress();
}

function markRead() {
  if (!current || advancing) return;
  advancing = true;
  queue.shift();
  readCount++;
  messageEl.textContent = '⭐ Great reading!';
  messageEl.classList.remove('celebrate');
  setTimeout(showNext, 500);
}

function tryLater() {
  if (!current || advancing) return;
  if (queue.length > 1) {
    queue.push(queue.shift()); // back of the pile
    showNext();
  } else {
    messageEl.textContent = 'Give it one more try — you can do it!';
    speakWord();
  }
}

function startGame() {
  stopAudio();
  queue = shuffle([...WORDS]);
  readCount = 0;
  current = "";
  advancing = false;
  buttonsEl.style.display = 'flex';
  againBtn.style.display = 'none';
  messageEl.textContent = '';
  messageEl.classList.remove('celebrate');
  starsEl.textContent = '';
  showNext();
}

document.getElementById('card').addEventListener('click', speakWord);
document.getElementById('hear-btn').addEventListener('click', (e) => { speakWord(); e.target.blur(); });
document.getElementById('got-btn').addEventListener('click', (e) => { markRead(); e.target.blur(); });
document.getElementById('later-btn').addEventListener('click', (e) => { tryLater(); e.target.blur(); });
againBtn.addEventListener('click', (e) => { startGame(); e.target.blur(); });

// Keyboard (Chromebook): Space = hear it, Enter = I read it!
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); speakWord(); }
  else if (e.code === 'Enter') { markRead(); }
});

startGame();
</script>
